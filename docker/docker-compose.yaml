services:
  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        PHP_ENV: development
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_php
    volumes:
      - ..:/var/www:cached
    depends_on:
      - postgres
      - redis
    networks:
      - app
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      args:
        NGINX_ENV: default
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../public:/var/www/public:cached
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-v3}
      POSTGRES_USER: ${DB_USER:-symfony}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-symfony}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        PHP_ENV: development
    container_name: ${COMPOSE_PROJECT_NAME:-v3}_worker
    command: php bin/console messenger:consume async --limit=100 --time-limit=3600 --memory-limit=128M
    volumes:
      - ..:/var/www:cached
    depends_on:
      - postgres
      - redis
    networks:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app:
    driver: bridge
